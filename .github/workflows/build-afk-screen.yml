name: Build Panda AFK Screen

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_afk.txt

      - name: Decode source
        shell: pwsh
        run: python unpack_afk_source.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_afk.txt

      - name: Vendor vgamepad safely
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yannbouteiller/vgamepad/archive/refs/tags/v0.1.0.zip" -OutFile "vendor\vgamepad.zip"
          Expand-Archive -Path "vendor\vgamepad.zip" -DestinationPath "vendor\src" -Force
          Copy-Item -Path "vendor\src\vgamepad-0.1.0\vgamepad" -Destination ".\vgamepad" -Recurse -Force
          if (!(Test-Path ".\vgamepad\win\vigem\client\x64\ViGEmClient.dll")) {
            throw "ViGEmClient.dll missing from vgamepad source"
          }

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile afk_screen.py
          python -m compileall -q vgamepad

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PandaAFKScreen --add-binary "vgamepad\win\vigem\client\x64\ViGEmClient.dll;vgamepad\win\vigem\client\x64" afk_screen.py

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\PandaAFKScreen.exe).Hash
          "PandaAFKScreen.exe  SHA256=$hash" | Out-File -Encoding ascii .\dist\SHA256.txt
          Write-Host "SHA256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaAFKScreen-Windows
          path: |
            dist/PandaAFKScreen.exe
            dist/SHA256.txt
            afk_screen.py
          if-no-files-found: error
