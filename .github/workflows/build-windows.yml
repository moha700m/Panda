name: Build Panda Training Standalone

permissions:
  contents: read

on:
  push:
    branches: [ main, ui-v2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit code $LASTEXITCODE" }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed with exit code $LASTEXITCODE" }

      - name: Vendor vgamepad safely
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yannbouteiller/vgamepad/archive/refs/tags/v0.1.0.zip" -OutFile "vendor\vgamepad.zip"
          Expand-Archive -Path "vendor\vgamepad.zip" -DestinationPath "vendor\src" -Force
          Copy-Item -Path "vendor\src\vgamepad-0.1.0\vgamepad" -Destination ".\vgamepad" -Recurse -Force
          if (!(Test-Path ".\vgamepad\win\vigem\client\x64\ViGEmClient.dll")) {
            throw "ViGEmClient.dll missing from vgamepad source"
          }
          Write-Host "Vendored vgamepad v0.1.0 without running setup.py"

      - name: Validate source
        shell: pwsh
        run: |
          python -m compileall -q panda tests main.py app.py
          if ($LASTEXITCODE -ne 0) { throw "Python source compilation failed with exit code $LASTEXITCODE" }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed with exit code $LASTEXITCODE" }
          python -m compileall -q vgamepad
          if ($LASTEXITCODE -ne 0) { throw "Vendored vgamepad compilation failed with exit code $LASTEXITCODE" }
          if (!(Test-Path ".\vgamepad\win\vigem\client\x64\ViGEmClient.dll")) {
            throw "ViGEmClient.dll missing"
          }

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PandaTrainingStandalone --hidden-import PySide6.QtCore --hidden-import PySide6.QtGui --hidden-import PySide6.QtWidgets --hidden-import shiboken6 --add-binary "vgamepad\win\vigem\client\x64\ViGEmClient.dll;vgamepad\win\vigem\client\x64" main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }

      - name: Smoke test EXE without hardware
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\PandaTrainingStandalone.exe" -PassThru
          try {
            Start-Sleep -Seconds 12
            $process.Refresh()
            if ($process.HasExited) { throw "PandaTrainingStandalone.exe exited during its startup smoke test (exit code $($process.ExitCode))" }
            Write-Host "Packaged app remained open without ViGEmBus or a physical controller."
          } finally {
            $process.Refresh()
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Report PyInstaller warnings
        shell: pwsh
        run: |
          $warningFile = ".\build\PandaTrainingStandalone\warn-PandaTrainingStandalone.txt"
          if (!(Test-Path $warningFile)) { throw "PyInstaller warning report is missing" }
          $warningLines = Get-Content $warningFile
          if ($warningLines.Count -eq 0) {
            Write-Host "PyInstaller reported no missing imports."
          } else {
            Write-Host "PyInstaller import warnings (reviewed; optional imports may be platform-specific):"
            $warningLines | ForEach-Object { Write-Host $_ }
          }

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\PandaTrainingStandalone.exe).Hash
          "PandaTrainingStandalone.exe  SHA256=$hash" | Out-File -Encoding ascii .\dist\SHA256.txt
          Write-Host "SHA256=$hash"

      - name: Upload EXE
        uses: actions/upload-artifact@v6
        with:
          name: PandaTrainingStandalone-Windows
          path: |
            dist/PandaTrainingStandalone.exe
            dist/SHA256.txt
          if-no-files-found: error
