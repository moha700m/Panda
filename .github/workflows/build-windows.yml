name: Build Panda Training Standalone

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate source
        shell: pwsh
        run: python -m py_compile app.py

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PandaTrainingStandalone --collect-all vgamepad app.py

      - name: Generate SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\dist\PandaTrainingStandalone.exe).Hash
          "PandaTrainingStandalone.exe  SHA256=$hash" | Out-File -Encoding ascii .\dist\SHA256.txt
          Write-Host "SHA256=$hash"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PandaTrainingStandalone-Windows
          path: |
            dist/PandaTrainingStandalone.exe
            dist/SHA256.txt
          if-no-files-found: error
